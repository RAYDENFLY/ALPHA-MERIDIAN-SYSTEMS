app_name: SMC-SNR ML Perpetual Scanner
version: 1.0.0
mode: PAPER
live_trading_locked: true
data_dir: ./data
db_filename: scanner.db
watchlist:
- ADAUSDT
- XRPUSDT
- BTCUSDT
- BNBUSDT
- ETHUSDT
- SOLUSDT
- AVAXUSDT
- LINKUSDT
- XMRUSDT
- DOGEUSDT
- LTCUSDT
enabled_symbols:
- ADAUSDT
- XRPUSDT
- BTCUSDT
- BNBUSDT
- ETHUSDT
- SOLUSDT
- AVAXUSDT
- LINKUSDT
- XMRUSDT
- DOGEUSDT
- LTCUSDT
exchange:
  name: Aster DEX
  base_url: https://fapi.asterdex.com
  request_timeout: 15
  max_retries: 4
  retry_delay_sec: 1.0
  rate_limit_calls_per_min: 600
  maker_fee_rate: 0.0002
  taker_fee_rate: 0.0005
  slippage_rate: 0.0005
risk:
  initial_equity_usdt: 16.0
  margin_mode: ISOLATED
  max_leverage: 10
  target_isolated_margin_usdt: 1.0
  target_isolated_margin_max_usdt: 1.5
  hard_risk_limit_usdt: 1.5
  risk_per_trade_usdt: 0.25
  daily_loss_limit_usdt: 0.5
  weekly_loss_limit_usdt: 1.25
  max_open_positions: 3
  max_entries_per_week: null
  min_notional_usdt: 5.0
  buffer_pct_for_fees: 0.02
strategy:
  execution_timeframe: 1h
  bias_timeframe: 4h
  swing_left_bars: 3
  swing_right_bars: 3
  atr_period: 14
  sl_buffer_atr_multiple: 0.5
  min_reward_to_risk: 1.5
  fvg_min_size_atr_ratio: 0.1
  sr_cluster_tolerance_pct: 0.015
  premium_threshold: 0.7
  discount_threshold: 0.3
  min_extension_48h: 0.035
  min_impulse_12h: 0.012
  short_macro_cap_168h: 0.12
  bull_breakout_pos_72h: 0.85
  bull_breakout_ret_24h: 0.035
  bull_breakout_ret_48h: 0.045
  bull_breakout_ret_168h: 0.06
  bull_variance_ratio_min: 1.05
  full_exit_at_tp1: true
  tp1_rr_multiple: 1.65
  min_stop_distance_pct: 0.012
ml:
  enabled: true
  model_type: lightgbm
  label_horizon_bars: 12
  train_split: 0.6
  val_split: 0.2
  test_split: 0.2
  calibration_method: isotonic
  min_confidence_threshold: 0.55
  min_samples_required: 100
model_b:
  enabled: true
  model_id: MODEL_B
  version: 1.0.0-alpha
  initial_equity_usdt: 100.0
  target_trade_risk_usdt: 1.0
  daily_loss_limit_usdt: 3.0
  weekly_loss_limit_usdt: 7.5
  max_open_positions: 6
  max_open_per_direction: 3
  cohort_version: MODEL_B_V2_REMEDIATED
  cohort_cutover_ms: 1792838400000
  live_target_trade_risk_usdt: 0.45
  live_max_margin_usdt: 4.0
  live_daily_loss_limit_usdt: 1.35
  live_weekly_loss_limit_usdt: 3.0
  live_max_open_positions: 2
  live_max_open_per_direction: 1
  max_leverage: 10
  short_regime_gate_enabled: true
  diagnostic_breaker_override: false
  min_risk_reward: 1.5
  max_spread_bps: 15.0
  min_depth_imbalance: 0.2
  min_24h_volume_usdt: 1000000.0
  scan_interval_sec: 60
  enabled_venues:
  - asterdex
  - binance
  - hyperliquid
paper:
  enabled: true
  full_exit_at_tp1: true
